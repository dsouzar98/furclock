<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurClock • Hourly Animal Sounds</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #ff9a9e, #fad0c4); margin:0; padding:0; color:#333; }
        .container { max-width: 800px; margin: 0 auto; padding: 60px 20px; text-align:center; }
        h1 { font-size: 4rem; margin-bottom: 8px; }
        .tagline { font-size: 1.5rem; color:#444; margin-bottom: 50px; }
        .animals { display: flex; justify-content: center; gap: 40px; font-size: 5rem; margin: 50px 0; }
        .cta-button { background: #ff6b6b; color: white; border: none; padding: 18px 40px; font-size: 1.4rem; border-radius: 9999px; cursor: pointer; box-shadow: 0 15px 25px rgba(255,107,107,0.3); font-weight: 600; }
        .cta-button:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 FurClock 🐶</h1>
        <p class="tagline">Your hourly dose of chaos and love</p>
        <div class="animals">
            🐱 🐶 🐦 🐐
        </div>
        <h2>Never miss an hour again.</h2>
        <p style="font-size:1.25rem; max-width:520px; margin:40px auto; line-height:1.5;">Every hour your phone gently plays a cute (or chaotic) animal sound.</p>
        <button class="cta-button" onclick="window.location.href='/app/index.html'">Open Dashboard →</button>
        <p style="margin-top:80px; opacity:0.8;">Super simple • Set and forget • Freemium</p>
    </div>
</body>
</html>
